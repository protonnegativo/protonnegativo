name: Bomberman contribution graph

on:
  schedule:
    - cron: '0 */6 * * *' # a cada 6 horas
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Bloqueia o envio de nome de usuário e pontuação para o ranking público do projeto
      - name: block leaderboard reporting
        run: echo "0.0.0.0 elec.abozanona.me" | sudo tee -a /etc/hosts

      - name: generate Bomberman SVGs
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'bomberman'

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # O GitHub guarda as imagens externas do README (como o card de streak) por até 24h
      - name: refresh cached README images
        run: |
          curl -s https://github.com/${{ github.repository_owner }} \
            | grep -o 'https://camo.githubusercontent.com/[^"]*' | sort -u \
            | xargs -r -n1 curl -s -X PURGE -o /dev/null
