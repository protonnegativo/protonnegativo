name: Profile 3D contribution graph

on:
  schedule:
    - cron: '0 */6 * * *' # a cada 6 horas
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Gera os SVGs em ./profile-3d-contrib (v0.9.3, fixado pelo SHA do commit)
      - name: generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # O GitHub guarda as imagens externas do README (como o card de streak) por até 24h
      - name: refresh cached README images
        run: |
          curl -s https://github.com/${{ github.repository_owner }} \
            | grep -o 'https://camo.githubusercontent.com/[^"]*' | sort -u \
            | xargs -r -n1 curl -s -X PURGE -o /dev/null
